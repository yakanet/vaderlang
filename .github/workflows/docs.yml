name: Docs

# The site of the language (`site/`: its specification), with the API reference
# of the library (`lib/`) and of the compiler (`vader/`) beside it, two sites
# `vader doc -o` builds. Built on every pull request so that a site that no
# longer builds shows before the merge, and published to GitHub Pages from
# `main`. Pages takes "GitHub Actions" as its source in the repository's
# settings. The release job of `CI` runs it again on `main` once a release is
# published, for the download page names the latest release.
#
# A workflow of its own, not a job of `CI`: that one cancels a superseded run,
# which would stop a deployment halfway.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tools/doc-site/package-lock.json
            site/package-lock.json
      - name: Build Vader CLI from the C seed
        run: bash bootstrap/build.sh
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Build the sites
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ github.token }}
          VADER_DOC_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/
        run: |
          BASE_PATH="$BASE/lib" VADER_DOC_TITLE="Library" ./build/vader doc -o _site/lib lib
          BASE_PATH="$BASE/vader" VADER_DOC_TITLE="Compiler" ./build/vader doc -o _site/vader vader
          (cd site && npm ci --no-audit --no-fund --prefer-offline && BASE_PATH="$BASE" SITE_SOURCE_URL="$VADER_DOC_SOURCE_URL" SITE_API_DIR=../_site npm run build)
          cp -R site/build/. _site/
          for api in lib vader; do
            test -e "_site/$api/index.html" || { echo "the site links to $api/, which was not built"; exit 1; }
          done
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
