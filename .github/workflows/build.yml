name: CI

# One pass per target: the compiler is built once from the C seed, bundled,
# then tested in the same job (ADR 0115). The site is built from the Linux
# bundle once every target is green, and published from `main`. Pages takes
# "GitHub Actions" as its source in the repository's settings.

on:
  workflow_dispatch:
    inputs:
      # Measurement only (TODO.md, "CI review"): empty leaves the default of 4,
      # see `tests/hook_driver.test.ts::gateSize`.
      gate:
        description: 'VADER_TEST_GATE, concurrent driver builds in hook_driver (empty = 4)'
        required: false
        default: ''
  push:
    branches: [main]
  pull_request:

# Every push to `main` gets a run of its own, so each commit gets its fixed
# point and its suites; a new push to a pull request cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Type-check the only first-party TypeScript left in the repo root: the Bun
  # test runner and the benchmark programs (tests/ + bench/). It is the one
  # place that needs `bun install`: the test steps run zero-dep.
  typecheck:
    name: Typecheck harness
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (tsc --noEmit over tests/ + bench/)
        run: bun run typecheck

  # The bundle step stays first, before Bun or any package: it is also the
  # check that a clone with only a C compiler builds (docs/BOOTSTRAP.md). The
  # suite runs once the compiler exists, even when a later bundle step failed.
  platforms:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-26.04 }
          - { platform: windows-x64, runner: windows-latest }
          - { platform: darwin-arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/bundle
        with:
          platform: ${{ matrix.platform }}
      - uses: oven-sh/setup-bun@v2
        if: ${{ !cancelled() && runner.os != 'macOS' && hashFiles('build/vader', 'build/vader.exe') != '' }}
        with:
          bun-version: 1.3.13
      - name: Install X11's development package (raylib links -lX11)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - name: Test
        if: ${{ !cancelled() && runner.os != 'macOS' && hashFiles('build/vader', 'build/vader.exe') != '' }}
        env:
          VADER_TEST_GATE: ${{ inputs.gate }}
        run: bun run test --only-failures

  # The site of the language (`site/`), with the API reference of the library
  # (`lib/`) and of the compiler (`vader/`) beside it, two sites `vader doc -o`
  # builds. Built on every pull request so that a site that no longer builds
  # shows before the merge.
  site:
    name: Build the site
    needs: [typecheck, platforms]
    runs-on: ubuntu-26.04
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tools/doc-site/package-lock.json
            site/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: vader-linux-x64
          path: ${{ runner.temp }}/bundle
      - name: Take the compiler of the Linux bundle
        run: |
          mkdir -p build
          tar -xzf "$RUNNER_TEMP/bundle/vader-linux-x64.tar.gz" -C build --strip-components=1 vader-linux-x64/vader
      - id: pages
        if: env.PUBLISH == 'true'
        uses: actions/configure-pages@v6
      - name: Build the sites
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ github.token }}
          VADER_DOC_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/
        run: |
          export VADER_DOC_HOME_URL="$BASE/"
          BASE_PATH="$BASE/lib" VADER_DOC_TITLE="Library" ./build/vader doc -o _site/lib lib
          BASE_PATH="$BASE/vader" VADER_DOC_TITLE="Compiler" ./build/vader doc -o _site/vader vader
          (cd site && npm ci --no-audit --no-fund --prefer-offline && npm run check && BASE_PATH="$BASE" SITE_SOURCE_URL="$VADER_DOC_SOURCE_URL" SITE_API_DIR=../_site npm run build)
          cp -R site/build/. _site/
          for api in lib vader; do
            test -e "_site/$api/index.html" || { echo "the site links to $api/, which was not built"; exit 1; }
          done
      # Runs of `main` overlap, and one of an older commit can finish last:
      # only the run of the head publishes.
      - id: head
        name: Is this commit still the head of main?
        if: env.PUBLISH == 'true'
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            echo current=true >> "$GITHUB_OUTPUT"
          else
            echo "main has moved past $GITHUB_SHA: the run of its head publishes the site"
          fi
      - if: steps.head.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: site
    if: ${{ needs.site.outputs.current == 'true' }}
    runs-on: ubuntu-26.04
    # One deployment at a time, never cut short.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
