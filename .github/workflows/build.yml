name: CI

on:
  # `gate` exists to MEASURE, not to configure. A driven build costs 21 s alone on
  # a Windows runner and 139-272 s inside the suite ; how many run at once is the
  # last untested cause (TODO.md, "CI review"). Empty on every push and PR, which
  # leaves the default of 4 — see `tests/hook_driver.test.ts::gateSize`.
  workflow_dispatch:
    inputs:
      gate:
        description: 'VADER_TEST_GATE — concurrent driver builds in hook_driver (empty = 4)'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Cancel superseded runs on the same ref — except for tags, where the build
# usually feeds a release and shouldn't be aborted by a follow-up push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Type-check the only first-party TypeScript left in the repo root: the Bun
  # test runner and the benchmark programs (tests/ + bench/). The compiler
  # itself is Vader now (§2.8); this job guards the surviving harness. It is the
  # one place that needs `bun install` — the test jobs run zero-dep.
  typecheck:
    name: Typecheck harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (tsc --noEmit over tests/ + bench/)
        run: bun run typecheck

  # Should test for posix-system. In a future we will separate Linux build & MacOS build
  test-posix:
    name: Test (Posix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Build Vader CLI from the C seed
        run: bash bootstrap/build.sh
      - name: Test
        env:
          VADER_TEST_GATE: ${{ inputs.gate }}
        run: bun run test --only-failures

  # Real Windows build + test. Faithful (unlike wine) and a regression guard for
  # the Windows-specific surface (CRLF stdio, path separators, the runtime).
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Verify a mingw-w64 gcc is on PATH
        shell: pwsh
        run: |
          gcc --version
          $triple = & gcc -dumpmachine
          if ($triple -ne "x86_64-w64-mingw32") {
            throw "gcc targets '$triple', not x86_64-w64-mingw32 — bootstrap/build.ps1 needs mingw-w64"
          }
      - name: Build Vader CLI from the C seed (Windows)
        shell: pwsh
        run: pwsh bootstrap/build.ps1
      - name: Test
        env:
          VADER_TEST_GATE: ${{ inputs.gate }}
        run: bun run test --only-failures

  # Fixed-point check: build the toolchain three-stage, confirm stage1 and stage2
  # emit identical C for main.vader (release AND debug), that two split builds are
  # byte-identical, and that the committed seed is fresh. Bun-free.
  #
  # Runs on every push and PR. It used to be gated to dispatch / tags as "too slow
  # for every PR", which the numbers contradict: it measured 257 s and 286 s the
  # two times it actually ran, against 10 m 59 s for the Windows job that sets the
  # run's total. A 4-minute Linux job finishes inside that shadow, so the wall
  # clock is unchanged and the cost is runner minutes only.
  #
  # It is also the ONLY job that would notice any of the three. `test-posix` and
  # `test-windows` build stage0 from the seed and then self-compile stage1 from
  # current sources, so they pass with a STALE seed — nothing else on push does.
  # docs/BOOTSTRAP.md Phase 4.
  fixed-point:
    name: Fixed-point verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify.sh (stage1 == stage2 + seed freshness)
        run: bash bootstrap/verify.sh
