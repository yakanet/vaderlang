name: CI

on:
  # `gate` exists to MEASURE, not to configure. A driven build costs 21 s alone on
  # a Windows runner and 139-272 s inside the suite ; how many run at once is the
  # last untested cause (TODO.md, "CI review"). Empty on every push and PR, which
  # leaves the default of 4 — see `tests/hook_driver.test.ts::gateSize`.
  workflow_dispatch:
    inputs:
      gate:
        description: 'VADER_TEST_GATE — concurrent driver builds in hook_driver (empty = 4)'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Cancel superseded runs on the same ref — except for tags, where the build
# usually feeds a release and shouldn't be aborted by a follow-up push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Bun-free cold-start guarantee (§2.8): a stock C compiler turns the
  # committed C seed into the full compiler via the 3-stage bootstrap — no Bun,
  # no TypeScript, no pre-existing vader. This job deliberately does NOT install
  # Bun ; that is the whole point. See docs/BOOTSTRAP.md.
  seed-rebuild:
    name: Rebuild compiler from C seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # bootstrap/build.sh: cc the seed -> stage0, stage0 -> stage1,
      # stage1 -> build/vader (stage2). GC arenas auto-grow — no tuning needed.
      - name: Build the full compiler from the seed
        run: bash bootstrap/build.sh

      - name: Smoke test the rebuilt compiler
        run: ./build/vader build --target=c --out=build/_smoke.c tests/snippets/return_42/_main.vader

  # Type-check the only first-party TypeScript left in the repo root: the Bun
  # test runner and the benchmark programs (tests/ + bench/). The compiler
  # itself is Vader now (§2.8); this job guards the surviving harness. It is the
  # one place that needs `bun install` — the test jobs run zero-dep.
  typecheck:
    name: Typecheck harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc --noEmit over tests/ + bench/)
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # Build the compiler under test from the committed C seed — no TS. This is
      # the §2.8 path: once src/ is deleted, the seed is the only way to get a
      # vader binary. bootstrap/build.sh runs the full 3-stage bootstrap and
      # leaves the compiler at build/vader. GC arenas auto-grow — no tuning needed.
      - name: Build Vader CLI from the C seed (used by tests)
        run: bash bootstrap/build.sh

      # --only-failures: hide passing tests, keep the log to failures + summary
      # (the local `bun run test` stays verbose for interactive use).
      - name: Test
        env:
          VADER_TEST_GATE: ${{ inputs.gate }}
        run: bun run test --only-failures

  # Real Windows build + test. Faithful (unlike wine) and a regression guard for
  # the Windows-specific surface (CRLF stdio, path separators, the runtime).
  # `continue-on-error` while the suite is still red on Windows — it reports the
  # real diffs without blocking PRs ; flip it off once green.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # No toolchain install: `windows-latest` already ships a mingw-w64 gcc on
      # PATH at `C:\mingw64\bin\gcc.exe`, reporting `x86_64-w64-mingw32` — probed on
      # run #224, where choco's own target was still empty beforehand. Dropping
      # that `choco install mingw` step is worth 56 s per run. It also changed the
      # compiler doing the work: choco's mingw was gcc 16.1.0, the image's is 15.2.0.
      #
      # The step below is the loud failure if a future image stops shipping it. It
      # checks `-dumpmachine`, not just the version, because the real hazard is not
      # absence: an MSYS2 `usr\bin\gcc` targets the msys runtime and would link the
      # compiler against `msys-2.0.dll`. MSVC is unsupported either way — the
      # runtime uses `__attribute__((weak))`.
      - name: Verify a mingw-w64 gcc is on PATH
        shell: pwsh
        run: |
          gcc --version
          $triple = & gcc -dumpmachine
          if ($triple -ne "x86_64-w64-mingw32") {
            throw "gcc targets '$triple', not x86_64-w64-mingw32 — bootstrap/build.ps1 needs mingw-w64"
          }

      # 3-stage bootstrap from the committed C seed (PowerShell entry point).
      - name: Build Vader CLI from the C seed (Windows)
        shell: pwsh
        run: pwsh bootstrap/build.ps1

      - name: Test
        env:
          VADER_TEST_GATE: ${{ inputs.gate }}
        run: bun run test --only-failures

  # Heavy fixed-point check: build the toolchain, confirm stage1 and stage2 emit
  # identical C for main.vader, and the committed seed is fresh. Bun-free, gated
  # to manual dispatch / release tags — too slow for every PR. docs/BOOTSTRAP.md Phase 4.
  fixed-point:
    name: Fixed-point verification
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6

      - name: verify.sh (stage1 == stage2 + seed freshness)
        run: bash bootstrap/verify.sh
