name: CI

on:
  # `gate` exists to MEASURE, not to configure. A driven build costs 21 s alone on
  # a Windows runner and 139-272 s inside the suite ; how many run at once is the
  # last untested cause (TODO.md, "CI review"). Empty on every push and PR, which
  # leaves the default of 4, see `tests/hook_driver.test.ts::gateSize`.
  workflow_dispatch:
    inputs:
      gate:
        description: 'VADER_TEST_GATE, concurrent driver builds in hook_driver (empty = 4)'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Cancel superseded runs on the same ref, except for tags, where the build
# usually feeds a release and shouldn't be aborted by a follow-up push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Type-check the only first-party TypeScript left in the repo root: the Bun
  # test runner and the benchmark programs (tests/ + bench/). The compiler
  # itself is Vader now (§2.8); this job guards the surviving harness. It is the
  # one place that needs `bun install`: the test jobs run zero-dep.
  typecheck:
    name: Typecheck harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (tsc --noEmit over tests/ + bench/)
        run: bun run typecheck

  # Should test for posix-system. In a future we will separate Linux build & MacOS build
  test-posix:
    name: Test (Posix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Build Vader CLI from the C seed
        run: bash bootstrap/build.sh
      - name: Install X11's development package (raylib links -lX11)
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - name: Test
        env:
          VADER_TEST_GATE: ${{ inputs.gate }}
        run: bun run test --only-failures

  # Real Windows build + test : a regression guard for the Windows-specific
  # surface (CRLF stdio, path separators, the runtime).
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # The image's LLVM, aimed at the image's MinGW sysroot, in place of MinGW's
      # own gcc (ADR 0021). Exports `CC` to the steps below.
      - name: Set up clang targeting MinGW
        shell: pwsh
        run: pwsh -NoProfile -File tools/ci/mingw-clang.ps1
      - name: Build Vader CLI from the C seed (Windows)
        shell: pwsh
        run: pwsh bootstrap/build.ps1
      - name: Test
        env:
          VADER_TEST_GATE: ${{ inputs.gate }}
        run: bun run test --only-failures

  # Fixed-point check: build the toolchain from the committed seed, confirm stage1
  # and stage2 emit identical C for main.vader (release AND debug), and that two
  # split builds are byte-identical. Bun-free. Runs on every push and PR (ADR 0006).
  #
  # It is also the seed's viability gate: the same `verify.sh` the pre-push hook
  # runs through `bootstrap/seed.sh check`. A seed that cannot build the tree fails
  # the test jobs too; what only this job sees is a fixed-point or
  # reproducibility break. See docs/BOOTSTRAP.md.
  fixed-point:
    name: Fixed-point verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify.sh (stage1 == stage2, reproducible)
        run: bash bootstrap/verify.sh

  # On a `v*` tag, the toolchain as a download: one self-contained bundle per
  # platform, which `release` attaches to the GitHub Release of the tag. The
  # archive names carry no version, so `releases/latest/download/<name>` always
  # reaches the newest one; the site's download page links there. A manual run
  # builds the bundles as artifacts, without a release.
  dist:
    name: Bundle (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-latest }
          # The oldest supported image: the binary needs the glibc it was linked against.
          - { platform: linux-x64, runner: ubuntu-22.04 }
          - { platform: windows-x64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v6
      # Before any build: a release is named after the version the binary reports.
      - name: Check that the tag is the version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^export CLI_VERSION :: "\(.*\)"$/\1/p' vader/tools/cli/spec.vader)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "the tag is $GITHUB_REF_NAME, CLI_VERSION is $version"; exit 1; }
      - name: Build the bundle
        if: runner.os != 'Windows'
        run: bash bootstrap/build.sh --dist
      - name: Set up clang targeting MinGW
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File tools/ci/mingw-clang.ps1
      - name: Build the bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh bootstrap/build.ps1 -Dist
      # Away from the checkout, the bundle must find everything beside itself.
      - name: Run and build hello world with the bundle
        if: runner.os != 'Windows'
        run: |
          vader="$PWD/dist/vader-${{ matrix.platform }}/vader"
          "$vader" --version
          mkdir "$RUNNER_TEMP/hello" && cp examples/hello/hello.vader "$RUNNER_TEMP/hello/"
          cd "$RUNNER_TEMP/hello"
          "$vader" run hello.vader
          "$vader" build --out=hello hello.vader && ./hello
      - name: Run and build hello world with the bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vader = Join-Path $PWD 'dist\vader-${{ matrix.platform }}\vader.exe'
          & $vader --version
          $hello = Join-Path $env:RUNNER_TEMP 'hello'
          New-Item -ItemType Directory $hello | Out-Null
          Copy-Item examples\hello\hello.vader $hello
          Set-Location $hello
          & $vader run hello.vader
          if ($LASTEXITCODE -ne 0) { throw 'vader run failed' }
          & $vader build --out=hello.exe hello.vader
          if ($LASTEXITCODE -ne 0) { throw 'vader build failed' }
          .\hello.exe
      - name: Archive
        if: runner.os != 'Windows'
        run: tar -czf vader-${{ matrix.platform }}.tar.gz -C dist vader-${{ matrix.platform }}
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\vader-${{ matrix.platform }} -DestinationPath vader-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: vader-${{ matrix.platform }}
          path: vader-${{ matrix.platform }}.*
          if-no-files-found: error

  # The release of a tag, once every check above has passed on it. The site is
  # published again from `main` after it: its download page names the latest
  # release. A release made with this job's token triggers no workflow by
  # itself; a dispatch does.
  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [typecheck, test-posix, test-windows, fixed-point, dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true
      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" archives/* --verify-tag --generate-notes --title "Vader $GITHUB_REF_NAME"
      - name: Publish the site again
        run: gh workflow run docs.yml --ref main
